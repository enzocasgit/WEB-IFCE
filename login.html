<!DOCTYPE html>

</head>
<body>

    <header>
        <h1>Administração — Catálogo de Filmes</h1>
    </header>

    <nav>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="cadastro-filmes.html">Cadastro de filmes</a></li>
            <li><a href="cadastro-usuarios.html">Cadastro de usuários</a></li>
            <li><a href="index.html">Início</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Login</h2>

            <form action="#" method="post">
                <p>
                    <label for="usuario">Usuário:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </p>
                <p>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </p>
                <p>
                    <button type="submit">Entrar</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Criado por Enzo Capistrano</p>
        <p><a href="sobre.html">Sobre o autor</a></p>
